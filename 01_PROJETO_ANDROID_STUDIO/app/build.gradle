plugins { id 'com.android.application'; id 'com.google.gms.google-services' }
android {
    namespace 'com.itu.isl'
    compileSdk 36
    // versionCode sobe sozinho a cada build do GitHub (exigência da Play Store)
    defaultConfig { applicationId 'com.itu.isl'; minSdk 24; targetSdk 36; versionCode((System.getenv('ISL_VERSION_CODE') ?: '1') as int); versionName '1.1' }
    // Chave fixa de teste: permite instalar novas versões por cima da anterior.
    // Não use esta chave para publicar na Play Store.
    signingConfigs {
        debug { storeFile file('isl-debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' }
    }
    // release sai SEM assinatura: a chave de upload da Play Store fica fora do repositório público
    // e a assinatura é feita depois, com jarsigner.
    buildTypes { debug { signingConfig signingConfigs.debug }; release { minifyEnabled false } }
    lint { checkReleaseBuilds false; abortOnError false }
}

// Firebase SDK - Google Authentication + Firestore
dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.15.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
}
