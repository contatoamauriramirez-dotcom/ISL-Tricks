plugins { id 'com.android.application'; id 'com.google.gms.google-services' }
android {
    namespace 'com.itu.isl'
    compileSdk 35
    defaultConfig { applicationId 'com.itu.isl'; minSdk 24; targetSdk 35; versionCode 1; versionName '1.0' }
}

// Firebase SDK - Google Authentication + Firestore
dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.15.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
}
