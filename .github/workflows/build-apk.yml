name: Gerar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: 01_PROJETO_ANDROID_STUDIO
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Compilar APK de teste (debug)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ISL-BLADE-apk
          path: 01_PROJETO_ANDROID_STUDIO/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK para download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ISL_BLADE.apk
          TAG="v1.0-build${{ github.run_number }}-${{ github.run_attempt }}-${{ github.run_id }}"
          gh release create "$TAG" ISL_BLADE.apk --title "ISL BLADE — build ${{ github.run_number }}" --notes "APK de teste para instalar no Android." --latest
